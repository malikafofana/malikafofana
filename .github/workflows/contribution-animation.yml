name: Contribution animation
on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contribution-animation.yml'
permissions:
  contents: read
concurrency:
  group: contribution-animation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animation from actual contributions
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: malikafofana
          outputs: |
            generated/github-snake.svg?color_snake=#ff4a60&color_dots=#667085,#4d7aff,#83adff,#c2d3ff,#ff8a98
      - name: Store generated image
        uses: actions/upload-artifact@v4
        with:
          name: contribution-animation
          path: generated/github-snake.svg
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: contribution-animation
          path: generated
      - name: Update profile asset
        run: |
          install -D generated/github-snake.svg assets/github-snake.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-snake.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh contribution animation'
          git push origin HEAD:main
